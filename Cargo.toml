[workspace]
resolver = "2"
members = [
    "crates/exotickik_span",
    "crates/exotickik_diagnostics",
    "crates/exotickik_lexer",
    "crates/exotickik_ast",
    "crates/exotickik_parser",
    "crates/exotickik_types",
    "crates/exotickik_sema",
    "crates/exotickik_ir",
    "crates/exotickik_codegen",
    "crates/exotickik_fmt",
    "crates/exotickik_driver",
    "cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Exotickik contributors"]
rust-version = "1.75"

[workspace.dependencies]
exotickik_span = { path = "crates/exotickik_span" }
exotickik_diagnostics = { path = "crates/exotickik_diagnostics" }
exotickik_lexer = { path = "crates/exotickik_lexer" }
exotickik_ast = { path = "crates/exotickik_ast" }
exotickik_parser = { path = "crates/exotickik_parser" }
exotickik_types = { path = "crates/exotickik_types" }
exotickik_sema = { path = "crates/exotickik_sema" }
exotickik_ir = { path = "crates/exotickik_ir" }
exotickik_codegen = { path = "crates/exotickik_codegen" }
exotickik_fmt = { path = "crates/exotickik_fmt" }
exotickik_driver = { path = "crates/exotickik_driver" }

[profile.release]
opt-level = 3
lto = "thin"
